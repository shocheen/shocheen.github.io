<article class="publication" aria-labelledby="{{ include.publication.id | slugify }}">
  {% assign publication = include.publication %}
  <h3 id="{{ publication.id | slugify }}" class="publication-title"><a href="{{ publication.url | relative_url }}">{{ publication.title | escape }}</a></h3>
  <p class="publication-authors">{{ publication.authors | escape | replace: 'Sachin Kumar', '<strong>Sachin Kumar</strong>' }}</p>
  <p class="publication-venue">{{ publication.venue | escape }}</p>
  {% include publication-links.html publication=publication %}
</article>
